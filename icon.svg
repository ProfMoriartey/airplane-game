<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Red Ace app icon: a red biplane seen head-on against an evening sky. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f6c66a"/>
      <stop offset="0.45" stop-color="#d9773a"/>
      <stop offset="1" stop-color="#5a2a1c"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#sky)" stroke="#2b1a12" stroke-width="10"/>
  <!-- Wings -->
  <rect x="26" y="88" width="204" height="18" rx="9" fill="#b3171b" stroke="#2b1a12" stroke-width="6"/>
  <rect x="40" y="146" width="176" height="16" rx="8" fill="#b3171b" stroke="#2b1a12" stroke-width="6"/>
  <!-- Struts -->
  <g stroke="#2b1a12" stroke-width="6" stroke-linecap="round">
    <line x1="62" y1="104" x2="70" y2="148"/>
    <line x1="194" y1="104" x2="186" y2="148"/>
    <line x1="104" y1="104" x2="112" y2="148"/>
    <line x1="152" y1="104" x2="144" y2="148"/>
  </g>
  <!-- Wheels -->
  <g stroke="#2b1a12" stroke-width="6" stroke-linecap="round">
    <line x1="112" y1="160" x2="104" y2="196"/>
    <line x1="144" y1="160" x2="152" y2="196"/>
  </g>
  <circle cx="100" cy="202" r="12" fill="#2b1a12"/>
  <circle cx="156" cy="202" r="12" fill="#2b1a12"/>
  <!-- Engine cowling and spinning propeller -->
  <circle cx="128" cy="126" r="30" fill="#8e1014" stroke="#2b1a12" stroke-width="6"/>
  <circle cx="128" cy="126" r="62" fill="none" stroke="#2b1a12" stroke-opacity="0.35" stroke-width="5"/>
  <circle cx="128" cy="126" r="11" fill="#e2b76a" stroke="#2b1a12" stroke-width="4"/>
